name: macOS source validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: topdrop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Verify source and regressions
        run: Scripts/verify.sh
      - name: Build hardened local package
        run: Scripts/build-app.sh
      - name: Verify package and independently build source archive
        run: Scripts/verify-package.sh dist --rebuild-source
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: TopDrop-source-preview
          path: |
            dist/TopDrop.app.zip
            dist/TopDrop-source.zip
          if-no-files-found: error
          retention-days: 7
